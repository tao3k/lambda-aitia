name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-contract:
    name: License contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate repository and package licenses
        run: |
          python3 scripts/check_license_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lean-proof:
    name: Lean assurance laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore Lean cache
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proof/lean/lean-toolchain', 'proof/lean/lakefile.lean', 'proof/lean/lake-manifest.json') }}

      - name: Install project-local Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/.ci/home"
          export ELAN_HOME="$HOME/.elan"
          mkdir -p "$HOME"
          if [ ! -x "$ELAN_HOME/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build assurance proof library
        working-directory: proof/lean
        run: lake build LambdaAitiaModuleAssuranceProof

      - name: Save Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proof/lean/lean-toolchain', 'proof/lean/lakefile.lean', 'proof/lean/lake-manifest.json') }}

  scheme-runtime:
    name: Scheme, integration and Python runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GERBIL_BUILD_CORES: 12
      GERBIL_RELEASE_TAG: gerbil-v0.18.2-07c84815-linux-x86_64-ee5a236818e1b8fd9cc6e886b510795495e95402e790892961e6a1059a5c3208
      GERBIL_RELEASE_ARCHIVE: gerbil-v0.18.2-07c84815-linux-x86_64-ee5a236818e1b8fd9cc6e886b510795495e95402e790892961e6a1059a5c3208.tar.gz
      GERBIL_RELEASE_SHA256: 741d67f1d1a37e057181bfe8b3348ce2a9cfce06ac3b9c4e914400978f9d5fe7
      POO_FLOW_ROOT: ${{ github.workspace }}/poo-flow
    steps:
      - name: Checkout pinned POO Flow mechanism library
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tao3k/poo-flow
          ref: 996c4f23c517e22e20c0a6bb015439172cf6fc3d
          path: poo-flow
          submodules: false

      - name: Checkout Lambda Aitia under packages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: poo-flow/packages/lambda-aitia

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Download pinned prebuilt Gerbil 0.18 release
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/gerbil-release"
          archive="$RUNNER_TEMP/$GERBIL_RELEASE_ARCHIVE"
          url="https://github.com/tao3k/gerbil-bazel/releases/download/$GERBIL_RELEASE_TAG/$GERBIL_RELEASE_ARCHIVE"

          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$GERBIL_RELEASE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$release_root"
          tar -xzf "$archive" -C "$release_root"

          gerbil_home="$release_root/prefix/current"
          test -x "$gerbil_home/bin/gxi"
          test -x "$gerbil_home/bin/gxpkg"
          echo "GERBIL_HOME=$gerbil_home" >> "$GITHUB_ENV"
          echo "$release_root/prefix/bin" >> "$GITHUB_PATH"
          "$gerbil_home/bin/gxi" --version | tee "$RUNNER_TEMP/gerbil-version.txt"
          grep -F "Gerbil 07c8481" "$RUNNER_TEMP/gerbil-version.txt"

      - name: Install declared Gerbil package dependencies
        working-directory: poo-flow
        run: just deps

      - name: Run Scheme semantic closure
        working-directory: poo-flow/packages/lambda-aitia
        run: just check-semantic

      - name: Run SDLC and GitOps integration
        working-directory: poo-flow/packages/lambda-aitia
        run: just test-integration

      - name: Build and test native ABI and Python runtime
        working-directory: poo-flow/packages/lambda-aitia
        run: just check-native
