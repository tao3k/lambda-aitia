name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      lifecycle-stress:
        description: Replay the full bounded Scheme lifecycle state cover
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-proof:
    name: Lean assurance and SDLC design laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Cache Lean toolchain and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            dev/proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proof/lean/lean-toolchain', 'dev/proof/lean/lakefile.lean', 'dev/proof/lean/lake-manifest.json') }}

      - name: Install Lean toolchain manager
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - run: just check-proof

  quint-model:
    name: Quint lifecycle, retirement and ingress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Set up Node for pinned Quint
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Java for Quint TLC backend
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the locked Quint models
        env:
          AITIA_QUINT_BIN: ${{ github.workspace }}/dev/proof/quint/node_modules/.bin/quint
          QUINT_HOME: ${{ runner.temp }}/lambda-aitia-quint
        run: |
          npm ci --prefix dev/proof/quint
          mkdir -p "$QUINT_HOME"
          python3 dev/proof/quint/test_scheme_replay.py
          just check-quint check-quint-commit check-quint-ai-assurance

  scheme-runtime:
    name: Scheme checks and linked delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GERBIL_PATH: ${{ github.workspace }}/agentic-ai-lab/.gerbil
      GERBIL_LOADPATH: ${{ github.workspace }}/agentic-ai-lab/.gerbil/lib
    steps:
      - name: Checkout Aitia dependency declaration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve Lab from gerbil.pkg
        id: lab
        run: |
          mapfile -t revisions < <(sed -nE 's/^[[:space:]]*depend: \("github.com\/tao3k\/agentic-ai-lab@([0-9a-f]{40})"\)\)[[:space:]]*$/\1/p' gerbil.pkg)
          test "${#revisions[@]}" -eq 1
          printf 'revision=%s\n' "${revisions[0]}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Agentic AI Lab mechanism library
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tao3k/agentic-ai-lab
          ref: ${{ steps.lab.outputs.revision }}
          path: agentic-ai-lab
          persist-credentials: false

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev pkgconf sqlite3 zlib1g-dev

      - name: Install Gerbil and initialize the declared Core
        working-directory: agentic-ai-lab
        run: |
          git submodule update --init core
          python3 packages/automation/install_gerbil_release.py "$RUNNER_TEMP/gerbil-release"
          echo 'GAMBOPT=max-heap=2G,debug=q' >> "$GITHUB_ENV"
          cores=$(nproc)
          memory_cores=$(awk '/^MemTotal:/ { print int($2 / 2097152) }' /proc/meminfo)
          (( memory_cores >= 1 )) || memory_cores=1
          printf 'GERBIL_BUILD_CORES=%s\n' "$((cores < memory_cores ? cores : memory_cores))" >> "$GITHUB_ENV"

      - name: Cache Gerbil package dependencies
        id: gerbil-package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: lambda-aitia-gerbil-deps-v5-${{ runner.os }}-${{ runner.arch }}-${{ steps.lab.outputs.revision }}

      - name: Install Lab and Core dependencies
        if: steps.gerbil-package-cache.outputs.cache-hit != 'true'
        working-directory: agentic-ai-lab
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          timeout --signal=TERM --kill-after=5s 600s bash -e -c '
            gerbil env gerbil interactive packages/automation/runtime-dependencies.ss
            cd core
            gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss
          '

      - name: Save Gerbil package dependencies
        if: steps.gerbil-package-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: ${{ steps.gerbil-package-cache.outputs.cache-primary-key }}

      - name: Build Lab prerequisites
        working-directory: agentic-ai-lab
        run: |
          test "$(git -C core rev-parse HEAD)" = "$(git rev-parse HEAD:core)"
          test -z "$(git -C core status --porcelain --untracked-files=all)"
          gerbil env just build-core
          gerbil env gerbil pkg link github.com/tao3k/agentic-ai-lab "$PWD"
          # Gerbil emits the package manifest consumed by AITIA's build.
          timeout --signal=TERM --kill-after=5s 600s gerbil pkg build github.com/tao3k/agentic-ai-lab
          gerbil env just build-library deps-dev build-testing
          printf 'GERBIL_LOADPATH=%s:%s/.gerbil/lib:%s:%s/dev/.gerbil/lib\n' \
            "$GITHUB_WORKSPACE" "$PWD" "$PWD" "$PWD" >> "$GITHUB_ENV"

      - run: just check-scheme

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &rust-cache-paths |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-aitia-linked-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-${{ steps.lab.outputs.revision }}

      - name: Install the verified JJ executable
        run: |
          jj_dir="$(mktemp -d "$RUNNER_TEMP/aitia-jj.XXXXXX")"
          archive="$jj_dir/jj.tar.gz"
          curl --fail --location --output "$archive" \
            https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
          echo "d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$jj_dir"
          export AITIA_JJ_BIN="$jj_dir/jj"
          "$AITIA_JJ_BIN" --version
          echo "AITIA_JJ_BIN=$AITIA_JJ_BIN" >> "$GITHUB_ENV"

      - name: Set up Node for the Rust Quint consumer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install linked delivery tools
        run: |
          npm ci --prefix dev/proof/quint
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/aitia-wheel-tools"
          uv tool install 'maturin[patchelf]==1.16.0'
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          uv venv "$RUNNER_TEMP/aitia-pytest"
          uv pip install --python "$RUNNER_TEMP/aitia-pytest/bin/python" 'pytest==9.0.2'
          echo "AITIA_PYTEST_PYTHON=$RUNNER_TEMP/aitia-pytest/bin/python" >> "$GITHUB_ENV"

      - run: just test-jj-commit-evidence check-rust-delivery

      - name: Set up Java for full lifecycle stress replay
        if: github.event_name == 'workflow_dispatch' && inputs.lifecycle-stress
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Replay the full Scheme lifecycle state cover
        if: github.event_name == 'workflow_dispatch' && inputs.lifecycle-stress
        run: just stress-lifecycle-scheme

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Restore Cargo dependencies and build outputs
        id: rust-workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust-cache-paths
          key: ${{ runner.os }}-${{ runner.arch }}-aitia-workspace-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-aitia-workspace-

      - name: Check Rust workspace format, lint and tests
        run: just --justfile rust/workspace.just --working-directory . check-rust-format check-rust-lint test-rust-workspace

      - name: Save Rust workspace compiler cache
        if: >-
          ${{ !cancelled() && steps.rust-workspace-cache.outputs.cache-hit != 'true'
          && steps.rust-workspace-cache.outputs.cache-primary-key != ''
          && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust-cache-paths
          key: ${{ steps.rust-workspace-cache.outputs.cache-primary-key }}
