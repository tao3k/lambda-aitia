name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-contract:
    name: License contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate repository and package licenses
        run: |
          python3 scripts/check_license_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lean-proof:
    name: Lean assurance and SDLC design laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore Lean cache
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            dev/proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proof/lean/lean-toolchain', 'dev/proof/lean/lakefile.lean', 'dev/proof/lean/lake-manifest.json') }}

      - name: Install project-local Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/.ci/home"
          export ELAN_HOME="$HOME/.elan"
          mkdir -p "$HOME"
          if [ ! -x "$ELAN_HOME/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build assurance and SDLC proof libraries
        working-directory: dev/proof/lean
        run: lake build LambdaAitiaModuleAssuranceProof LambdaAitiaModuleSdlcProof LambdaAitiaModuleGitOpsProof

      - name: Reject sorry axioms in exported laws
        working-directory: dev/proof/lean
        shell: bash
        run: |
          set -euo pipefail
          output="$(lake env lean AxiomAudit.lean)"
          printf '%s\n' "$output"
          ! grep -q 'sorryAx' <<< "$output"

      - name: Save Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            dev/proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proof/lean/lean-toolchain', 'dev/proof/lean/lakefile.lean', 'dev/proof/lean/lake-manifest.json') }}

  quint-model:
    name: Quint lifecycle, retirement and ingress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test Scheme replay runner controls
        run: python3 dev/proof/quint/test_scheme_replay.py

      - name: Set up Node for pinned Quint
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Java for Quint TLC backend
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked Quint and check all 25 model contracts
        env:
          AITIA_QUINT_BIN: ${{ github.workspace }}/dev/proof/quint/node_modules/.bin/quint
          QUINT_HOME: ${{ runner.temp }}/lambda-aitia-quint
        run: |
          npm ci --prefix dev/proof/quint
          mkdir -p "$QUINT_HOME"
          python3 dev/proof/quint/check_contract.py
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/CommitEvidence.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/GitOpsWriteRecovery.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/GitOpsAttemptCompetition.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/AiAssuranceObjectives.qnt

  scheme-runtime:
    name: Native admission and linked delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Leave worker count to the native SDK/resource admission on this runner.
      # max-heap limits each Scheme process; it is not a tree-wide RSS limit.
      GAMBOPT: max-heap=2G,debug=q
      GERBIL_BAZEL_INSTALL_TIMEOUT_SECONDS: 180
      GERBIL_PATH: ${{ github.workspace }}/agentic-ai-lab/.gerbil
      GERBIL_LOADPATH: ${{ github.workspace }}/agentic-ai-lab/packages/lambda-aitia:${{ github.workspace }}/agentic-ai-lab:${{ github.workspace }}/agentic-ai-lab/.gerbil/lib
    steps:
      - name: Checkout Aitia dependency declaration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve Lab from gerbil.pkg
        id: lab
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t revisions < <(sed -nE 's/^[[:space:]]*depend: \("github.com\/tao3k\/agentic-ai-lab@([0-9a-f]{40})"\)\)[[:space:]]*$/\1/p' gerbil.pkg)
          test "${#revisions[@]}" -eq 1
          printf 'revision=%s\n' "${revisions[0]}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Agentic AI Lab mechanism library
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tao3k/agentic-ai-lab
          ref: ${{ steps.lab.outputs.revision }}
          path: agentic-ai-lab
          submodules: false

      - name: Checkout Lambda Aitia under packages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: agentic-ai-lab/packages/lambda-aitia

      - name: Initialize pinned Core source directory
        working-directory: agentic-ai-lab
        run: git submodule update --init core

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-version: 1
          disk-cache: lambda-aitia-${{ runner.os }}-gerbil-release-v1
          repository-cache: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev pkgconf sqlite3 zlib1g-dev
          pkg-config --keep-system-libs --libs openssl zlib sqlite3

      - name: Declare runner native compiler capacity
        shell: bash
        run: |
          set -euo pipefail
          cores="${GERBIL_BUILD_CORES:-$(getconf _NPROCESSORS_ONLN)}"
          [[ "$cores" =~ ^[1-9][0-9]*$ ]]
          printf 'GERBIL_BUILD_CORES=%s\n' "$cores" >> "$GITHUB_ENV"
          printf 'AITIA-RUNNER-CAPACITY configured=%s online=%s affinity=%s\n' \
            "$cores" "$(getconf _NPROCESSORS_ONLN)" "$(nproc)"

      - name: Resolve immutable Gerbil release and module graph
        working-directory: agentic-ai-lab
        run: bazelisk mod deps --lockfile_mode=error

      - name: Cold-build the Core-declared POO package without project caches
        id: native-cold
        # Collect independent runtime evidence after a budget refusal. The final
        # always-run admission below still requires this original outcome.
        continue-on-error: true
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            gxi -:max-heap=2G,debug=q packages/lambda-aitia/scripts/check-native-build-capacity.ss
            cd core
            cold_root=$(mktemp -d "$RUNNER_TEMP/lambda-aitia-poo-cold.XXXXXX")
            unset GERBIL_LOADPATH
            export GERBIL_PATH="$cold_root"
            test ! -e "$GERBIL_PATH/lib"
            # Source-only SDK acquisition owns clone, checkout and tag registration.
            # Its deadline is independent from the unchanged cold compile gate.
            test ! -e "$GERBIL_PATH/bin"
            test ! -e "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-poo.tag"
            test ! -e "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-poo.manifest"
            /usr/bin/time -v timeout --signal=TERM --kill-after=5s 180s \
              gxi -:max-heap=2G,debug=q \
              ../packages/lambda-aitia/scripts/build-native-dependency.ss \
              gerbil.pkg github.com/tao3k/gerbil-poo register
            # The native SDK creates empty prefix lib/bin directories itself.
            # Package products, rather than these directories, must stay absent.
            test ! -e "$GERBIL_PATH/lib/clan/poo"
            test ! -e "$GERBIL_PATH/bin/representation-main"
            test ! -e "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-poo.manifest"
            test ! -e "$GERBIL_PATH/pkg/TAGS"
            # Core gerbil.pkg owns the POO pin; the native SDK owns its install.
            # The native provider already selected the runner worker count.
            /usr/bin/time -v timeout --signal=TERM --kill-after=5s 180s gxpkg deps --install &
            build_pid=$!
            # Observe only commands referring to this unique cold prefix. This
            # never changes admission, worker capacity or the native deadline.
            (
              while kill -0 "$build_pid" 2>/dev/null; do
                date -u +%s.%N
                # Numeric parent links include C compiler children whose input
                # arrives through a pipe and has no cold-prefix argument.
                printf "PROCESS-TABLE\n"
                ps -eo pid=,ppid=,etimes=,cputimes=,rss=,comm=
                printf "PREFIX-ARGS\n"
                ps -eo pid=,ppid=,etimes=,cputimes=,rss=,comm=,args= \
                  | grep -F -- "$cold_root" | grep -v grep || true
                sleep 0.5
              done
            ) > "$RUNNER_TEMP/aitia-poo-cold-processes.log" &
            observer_pid=$!
            build_status=0
            wait "$build_pid" || build_status=$?
            wait "$observer_pid" || true
            printf "AITIA-COLD-POO-NATIVE-BUILD-STATUS status=%s\n" "$build_status"
            if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
            # A successful tag command that skipped the package is not content
            # admission. Require the actual cold source and its module identity.
            test -s "$GERBIL_PATH/pkg/TAGS"
            grep -F -- "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-poo/object.ss," \
              "$GERBIL_PATH/pkg/TAGS"
            grep -F -- ":clan/poo/object" "$GERBIL_PATH/pkg/TAGS"
            printf "AITIA-COLD-POO-NATIVE-BUILD-OK\n"
          '

      - name: Preserve actual cold compiler process observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aitia-poo-cold-processes
          path: ${{ runner.temp }}/aitia-poo-cold-processes.log
          if-no-files-found: ignore

      - name: Restore pinned Gerbil package cache
        id: gerbil-package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: lambda-aitia-native-cohort-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}

          restore-keys: |
            lambda-aitia-gerbil-pkgs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}
            lambda-aitia-gerbil-pkgs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel') }}

      - name: Materialize pinned native dependency commits
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            builder=packages/lambda-aitia/scripts/build-native-dependency.ss
            for package in gerbil-parser orgize gerbil-ascent; do
              timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" gerbil.pkg "github.com/tao3k/$package" register
            done
          '

      - name: Cold-build native dependency owners with individual deadlines
        if: steps.gerbil-package-cache.outputs.cache-matched-key == ''
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            builder=packages/lambda-aitia/scripts/build-native-dependency.ss
            # Existing native package declarations own every revision. The SDK
            # owns tag transitions, manifests, compiler jobs and complete specs.
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" core/gerbil.pkg github.com/tao3k/gerbil-poo
            core_revision=$(git -C core rev-parse HEAD)
            core_manifest=$(mktemp)
            trap "rm -f -- \"$core_manifest\"" EXIT
            printf "(depend: (\"github.com/tao3k/gebril-yuanxu@%s\"))\n" "$core_revision" > "$core_manifest"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" "$core_manifest" github.com/tao3k/gebril-yuanxu
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" gerbil.pkg github.com/tao3k/gerbil-parser
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" gerbil.pkg github.com/tao3k/gerbil-ascent
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" "$GERBIL_PATH/pkg/github.com/tao3k/orgize/gerbil.pkg" github.com/tao3k/gerbil-scheme-rust
            /usr/bin/time -v timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" gerbil.pkg github.com/tao3k/orgize
          '

      # Retain real generated compiler inputs for critical-path analysis.
      # Artifact collection neither retries nor admits a failed owner build.
      - name: Preserve native Org fold compilation inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aitia-org-fold-sources
          path: agentic-ai-lab/.gerbil/src/orgize-fold/
          if-no-files-found: ignore

      - name: Install declared Gerbil package dependencies
        if: steps.gerbil-package-cache.outputs.cache-matched-key == ''
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:install_dependencies
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.gerbil/pkg/install-resource-guard.receipt.json').read_text())
          if receipt['outcome'] != 'completed' or receipt['exitCode'] != 0:
              raise SystemExit(f"native dependency install did not complete: {receipt}")
          PYCODE

      - name: Complete ASCENT native phase products before importing consumers
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            checker=packages/lambda-aitia/scripts/check-native-products.ss
            spec="$GERBIL_PATH/ascent-native-spec.ss"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-ascent/build.ss" spec > "$spec"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$checker" repair gerbil-ascent "$spec" "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-ascent"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$checker" check gerbil-ascent "$spec"
          '

      - name: Reject missing macro phases and tracked generated products
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-native-products'

      - name: Build manifest-owned native Core and ASP dependencies
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            builder=packages/lambda-aitia/scripts/build-native-dependency.ss
            # Demand compilation later writes the real Parent manifest. This
            # native update first registers its exact tag without a full build.
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" packages/lambda-aitia/gerbil.pkg github.com/tao3k/agentic-ai-lab register
            core_revision=$(git -C core rev-parse HEAD)
            core_manifest=$(mktemp)
            trap "rm -f -- \"$core_manifest\"" EXIT
            printf "(depend: (\"github.com/tao3k/gebril-yuanxu@%s\"))\n" "$core_revision" > "$core_manifest"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" "$core_manifest" github.com/tao3k/gebril-yuanxu
            test "$(git -C core rev-parse HEAD)" = "$(git -C "$GERBIL_PATH/pkg/github.com/tao3k/gebril-yuanxu" rev-parse HEAD)"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" dev/gerbil.pkg github.com/tao3k/asp-gerbil-scheme
          '

      - name: Build the native parent Library demanded by Aitia
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY" && timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q packages/lambda-aitia/scripts/build-native-parent.ss'

      - name: Build published native testing support
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY" && timeout 180s gxc -:max-heap=2G,debug=q -d "$GERBIL_PATH/lib" dev/modules/testing/testing-extension.ss && timeout 180s gxc -:max-heap=2G,debug=q -d "$GERBIL_PATH/lib" dev/modules/testing/source-admission.ss'

      - name: Save completed native dependency build inputs
        if: steps.gerbil-package-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: lambda-aitia-native-cohort-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}

      - name: Run Scheme semantic closure
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-semantic'

      - name: Bind Quint and Lean sources to the retirement POO contract
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-proof-scheme retirement-binding-test.ss'

      - name: Execute retirement ingress controls against Scheme Host
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-proof-scheme retirement-execution-test.ss'

      - name: Run SDLC and GitOps integration
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-integration'

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agentic-ai-lab/packages/lambda-aitia/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-aitia-linked-${{ hashFiles('agentic-ai-lab/packages/lambda-aitia/rust/Cargo.lock', 'agentic-ai-lab/packages/lambda-aitia/rust/**/Cargo.toml') }}-${{ steps.lab.outputs.revision }}

      - name: Qualify JJ cuts through ORG admission and ASCENT
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: |
          jj_dir="$(mktemp -d "$RUNNER_TEMP/aitia-jj.XXXXXX")"
          archive="$jj_dir/jj.tar.gz"
          curl --fail --location --output "$archive" \
            https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
          echo "d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$jj_dir"
          export AITIA_JJ_BIN="$jj_dir/jj"
          "$AITIA_JJ_BIN" --version
          cd ../..
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-jj-commit-evidence'
          echo "AITIA_JJ_BIN=$AITIA_JJ_BIN" >> "$GITHUB_ENV"

      - name: Set up Node for the Rust Quint consumer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked Quint for the Rust consumer
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: npm ci --prefix dev/proof/quint

      - name: Install wheel build tools
        run: |
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/aitia-wheel-tools"
          uv tool install 'maturin[patchelf]==1.16.0'
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          uv venv "$RUNNER_TEMP/aitia-pytest"
          uv pip install --python "$RUNNER_TEMP/aitia-pytest/bin/python" 'pytest==9.0.2'
          echo "AITIA_PYTEST_PYTHON=$RUNNER_TEMP/aitia-pytest/bin/python" >> "$GITHUB_ENV"

      - name: Set up Java for complete lifecycle state graph
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify the linked Rust program, Quint consumer and installed wheel
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-rust-delivery'

      - name: Replay every reachable lifecycle state and authorization delivery fault
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just stress-lifecycle-scheme'

      - name: Require original cold-build admission
        if: always()
        run: |
          test "${{ steps.native-cold.outcome }}" = success

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-aitia-workspace-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}

      - name: Check Rust workspace format, lint and tests
        run: just check-rust-format check-rust-lint test-rust-workspace
