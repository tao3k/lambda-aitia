name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-contract:
    name: License contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate repository and package licenses
        run: |
          python3 scripts/check_license_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lean-proof:
    name: Lean assurance and SDLC design laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore Lean cache
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proof/lean/lean-toolchain', 'proof/lean/lakefile.lean', 'proof/lean/lake-manifest.json') }}

      - name: Install project-local Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/.ci/home"
          export ELAN_HOME="$HOME/.elan"
          mkdir -p "$HOME"
          if [ ! -x "$ELAN_HOME/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build assurance and SDLC proof libraries
        working-directory: proof/lean
        run: lake build LambdaAitiaModuleAssuranceProof LambdaAitiaModuleSdlcProof

      - name: Reject sorry axioms in exported laws
        working-directory: proof/lean
        shell: bash
        run: |
          set -euo pipefail
          output="$(lake env lean AxiomAudit.lean)"
          printf '%s\n' "$output"
          ! grep -q 'sorryAx' <<< "$output"

      - name: Save Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proof/lean/lean-toolchain', 'proof/lean/lakefile.lean', 'proof/lean/lake-manifest.json') }}

  quint-model:
    name: Quint lifecycle, retirement and ingress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node for pinned Quint
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Java for Quint TLC backend
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked Quint and check all 25 model contracts
        env:
          AITIA_QUINT_BIN: ${{ github.workspace }}/proof/quint/node_modules/.bin/quint
          QUINT_HOME: ${{ runner.temp }}/lambda-aitia-quint
        run: |
          npm ci --prefix proof/quint
          mkdir -p "$QUINT_HOME"
          python3 proof/quint/check_contract.py

  scheme-runtime:
    name: Scheme, integration and Python runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GERBIL_BUILD_CORES: 12
      GAMBOPT: max-heap=2G,debug=q
      GERBIL_BAZEL_INSTALL_TIMEOUT_SECONDS: 180
      GERBIL_PATH: ${{ github.workspace }}/agentic-ai-lab/.gerbil
      GERBIL_LOADPATH: ${{ github.workspace }}/agentic-ai-lab/packages/lambda-aitia:${{ github.workspace }}/agentic-ai-lab:${{ github.workspace }}/agentic-ai-lab/.gerbil/lib
    steps:
      - name: Checkout pinned Agentic AI Lab mechanism library
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tao3k/agentic-ai-lab
          ref: 177ac1c448aa846345cde7a1538ab6f788548692
          path: agentic-ai-lab
          submodules: false

      - name: Checkout Lambda Aitia under packages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: agentic-ai-lab/packages/lambda-aitia

      - name: Initialize pinned Core source directory
        working-directory: agentic-ai-lab
        run: git submodule update --init core

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-version: 1
          disk-cache: lambda-aitia-${{ runner.os }}-gerbil-release-v1
          repository-cache: true

      - name: Resolve immutable Gerbil release and module graph
        working-directory: agentic-ai-lab
        run: bazelisk mod deps --lockfile_mode=error

      - name: Restore pinned Gerbil package cache
        id: gerbil-package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: lambda-aitia-native-cohort-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}

          restore-keys: |
            lambda-aitia-gerbil-pkgs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}
            lambda-aitia-gerbil-pkgs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel') }}

      - name: Materialize pinned native dependency commits
        working-directory: agentic-ai-lab
        run: python3 packages/automation/gerbil_dependency_pin.py prepare-native --package-root "$PWD/.gerbil/pkg"

      - name: Install declared Gerbil package dependencies
        if: steps.gerbil-package-cache.outputs.cache-matched-key == ''
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:install_dependencies
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.gerbil/pkg/install-resource-guard.receipt.json').read_text())
          if receipt['outcome'] != 'completed' or receipt['exitCode'] != 0:
              raise SystemExit(f"native dependency install did not complete: {receipt}")
          PYCODE

      - name: Complete ASCENT native phase products before importing consumers
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            checker=packages/lambda-aitia/scripts/check-native-products.ss
            spec="$GERBIL_PATH/ascent-native-spec.ss"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-ascent/build.ss" spec > "$spec"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$checker" repair gerbil-ascent "$spec" "$GERBIL_PATH/pkg/github.com/tao3k/gerbil-ascent"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$checker" check gerbil-ascent "$spec"
          '

      - name: Reject missing macro phases and tracked generated products
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q -e '"'"'(import (prefix-in :gerbil/tools/gxtest test.)) (exit (test.main "t/native-products-test.ss"))'"'"' '

      - name: Build manifest-owned native Core and ASP dependencies
        working-directory: agentic-ai-lab
        run: |
          python3 packages/automation/gerbil_dependency_pin.py prepare-native --package-root "$PWD/.gerbil/pkg" --manifest packages/lambda-aitia/gerbil.pkg
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc '
            set -euo pipefail
            cd "$BUILD_WORKSPACE_DIRECTORY"
            builder=packages/lambda-aitia/scripts/build-native-dependency.ss
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" packages/lambda-aitia/gerbil.pkg github.com/tao3k/gebril-yuanxu
            test "$(git -C core rev-parse HEAD)" = "$(git -C "$GERBIL_PATH/pkg/github.com/tao3k/gebril-yuanxu" rev-parse HEAD)"
            timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q "$builder" packages/lambda-aitia/gerbil.pkg github.com/tao3k/asp-gerbil-scheme
          '

      - name: Build the native parent Library demanded by Aitia
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY" && timeout --signal=TERM --kill-after=5s 180s gxi -:max-heap=2G,debug=q packages/lambda-aitia/scripts/build-native-parent.ss'

      - name: Build published native testing support
        working-directory: agentic-ai-lab
        run: |
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY" && timeout 180s gxc -:max-heap=2G,debug=q -d "$GERBIL_PATH/lib" dev/modules/testing/testing-extension.ss && timeout 180s gxc -:max-heap=2G,debug=q -d "$GERBIL_PATH/lib" dev/modules/testing/source-admission.ss'

      - name: Save completed native dependency build inputs
        if: steps.gerbil-package-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agentic-ai-lab/.gerbil
          key: lambda-aitia-native-cohort-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agentic-ai-lab/gerbil.pkg', 'agentic-ai-lab/MODULE.bazel', 'agentic-ai-lab/MODULE.bazel.lock', 'agentic-ai-lab/gerbil-bazel.MODULE.bazel', 'agentic-ai-lab/gerbil-dependencies.MODULE.bazel', 'agentic-ai-lab/packages/lambda-aitia/gerbil.pkg') }}

      - name: Run Scheme semantic closure
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-semantic'

      - name: Bind Quint and Lean sources to the retirement POO contract
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-scheme-atomic formal retirement-binding-test.ss'

      - name: Execute retirement ingress controls against Scheme Host
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-scheme-atomic formal retirement-execution-test.ss'

      - name: Set up Node for pinned Quint correspondence traces
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Replay Quint states and unsafe-model controls through Scheme
        working-directory: agentic-ai-lab
        run: |
          npm ci --prefix packages/lambda-aitia/proof/quint
          bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-quint-scheme'

      - name: Set up Java for complete lifecycle state graph
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Replay every reachable lifecycle state and authorization delivery fault
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-lifecycle-scheme'

      - name: Run SDLC and GitOps integration
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just test-integration'

      - name: Build and test native ABI and Python runtime
        working-directory: agentic-ai-lab
        run: bazelisk run @local_gerbil//:native_scheme_env -- bash -lc 'cd "$BUILD_WORKSPACE_DIRECTORY/packages/lambda-aitia" && just check-native'
