name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-contract:
    name: License contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate repository and package licenses
        run: |
          python3 scripts/check_license_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lean-proof:
    name: Lean assurance and SDLC design laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore Lean cache
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            dev/proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proof/lean/lean-toolchain', 'dev/proof/lean/lakefile.lean', 'dev/proof/lean/lake-manifest.json') }}

      - name: Install project-local Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/.ci/home"
          export ELAN_HOME="$HOME/.elan"
          mkdir -p "$HOME"
          if [ ! -x "$ELAN_HOME/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build assurance and SDLC proof libraries
        working-directory: dev/proof/lean
        run: lake build LambdaAitiaModuleAssuranceProof LambdaAitiaModuleSdlcProof LambdaAitiaModuleGitOpsProof

      - name: Reject sorry axioms in exported laws
        working-directory: dev/proof/lean
        shell: bash
        run: |
          set -euo pipefail
          output="$(lake env lean AxiomAudit.lean)"
          printf '%s\n' "$output"
          ! grep -q 'sorryAx' <<< "$output"

      - name: Save Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/home/.elan
            dev/proof/lean/.lake
          key: lambda-aitia-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proof/lean/lean-toolchain', 'dev/proof/lean/lakefile.lean', 'dev/proof/lean/lake-manifest.json') }}

  quint-model:
    name: Quint lifecycle, retirement and ingress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Lambda Aitia
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test Scheme replay runner controls
        run: python3 dev/proof/quint/test_scheme_replay.py

      - name: Set up Node for pinned Quint
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Java for Quint TLC backend
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked Quint and check all 25 model contracts
        env:
          AITIA_QUINT_BIN: ${{ github.workspace }}/dev/proof/quint/node_modules/.bin/quint
          QUINT_HOME: ${{ runner.temp }}/lambda-aitia-quint
        run: |
          npm ci --prefix dev/proof/quint
          mkdir -p "$QUINT_HOME"
          python3 dev/proof/quint/check_contract.py
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/CommitEvidence.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/GitOpsWriteRecovery.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/GitOpsAttemptCompetition.qnt
          "$AITIA_QUINT_BIN" test --backend=typescript dev/proof/quint/AiAssuranceObjectives.qnt

  scheme-runtime:
    name: Scheme, Rust and installed Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GERBIL_BUILD_CORES: 12
      GERBIL_PATH: ${{ github.workspace }}/agentic-ai-lab/.gerbil
      GERBIL_LOADPATH: ${{ github.workspace }}/agentic-ai-lab/packages/lambda-aitia:${{ github.workspace }}/agentic-ai-lab:${{ github.workspace }}/agentic-ai-lab/.gerbil/lib
    steps:
      - name: Checkout pinned Agentic AI Lab mechanism library
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tao3k/agentic-ai-lab
          ref: 94a385fcb7f40c881d8b91e07804947cabe65071
          path: agentic-ai-lab
          submodules: false

      - name: Checkout Lambda Aitia under packages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: agentic-ai-lab/packages/lambda-aitia

      - name: Initialize pinned Core source directory
        working-directory: agentic-ai-lab
        run: git submodule update --init core

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev pkgconf sqlite3 zlib1g-dev
          pkg-config --keep-system-libs --libs openssl zlib sqlite3

      - name: Install immutable Gerbil release
        working-directory: agentic-ai-lab
        run: python3 packages/automation/install_gerbil_release.py "$RUNNER_TEMP/aitia-gerbil-release"

      - name: Install declared Lab and Core dependencies
        working-directory: agentic-ai-lab
        run: |
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil env gerbil interactive packages/automation/runtime-dependencies.ss
          (cd core && gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss)

      - name: Build Agentic AI Lab mechanism library
        working-directory: agentic-ai-lab
        run: |
          gerbil env gerbil pkg link github.com/tao3k/agentic-ai-lab "$PWD"
          gerbil env just clean-core
          gerbil env just build

      - name: Install Lab development test dependencies
        working-directory: agentic-ai-lab/dev
        run: |
          production_lib="$GERBIL_PATH/lib"
          GERBIL_PATH="$PWD/.gerbil" GERBIL_LOADPATH="$production_lib" \
            gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss
          echo "GERBIL_LOADPATH=$GERBIL_LOADPATH:$PWD/.gerbil/lib" >> "$GITHUB_ENV"

      - name: Run Scheme semantic closure
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: gerbil env just check-semantic

      - name: Bind Quint and Lean sources to the retirement POO contract
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: gerbil env just test-proof-scheme retirement-binding-test.ss

      - name: Execute retirement ingress controls against Scheme Host
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: gerbil env just test-proof-scheme retirement-execution-test.ss

      - name: Run SDLC and GitOps integration
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: gerbil env just test-integration

      - name: Qualify JJ cuts through ORG admission and ASCENT
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: |
          jj_dir="$(mktemp -d "$RUNNER_TEMP/aitia-jj.XXXXXX")"
          archive="$jj_dir/jj.tar.gz"
          curl --fail --location --output "$archive" \
            https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
          echo "d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$jj_dir"
          export AITIA_JJ_BIN="$jj_dir/jj"
          "$AITIA_JJ_BIN" --version
          gerbil env just test-jj-commit-evidence
          echo "AITIA_JJ_BIN=$AITIA_JJ_BIN" >> "$GITHUB_ENV"

      - name: Check Rust workspace format, lint and tests
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: just check-rust-format check-rust-lint test-rust-workspace

      - name: Set up Node for the Rust Quint consumer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked Quint for the Rust consumer
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: npm ci --prefix dev/proof/quint

      - name: Install wheel build tools
        run: |
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/aitia-wheel-tools"
          uv tool install 'maturin[patchelf]==1.16.0'
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          uv venv "$RUNNER_TEMP/aitia-pytest"
          uv pip install --python "$RUNNER_TEMP/aitia-pytest/bin/python" 'pytest==9.0.2'
          echo "AITIA_PYTEST_PYTHON=$RUNNER_TEMP/aitia-pytest/bin/python" >> "$GITHUB_ENV"

      - name: Qualify the linked Rust program, Quint consumer and installed wheel
        working-directory: agentic-ai-lab/packages/lambda-aitia
        run: gerbil env just check-rust-delivery
