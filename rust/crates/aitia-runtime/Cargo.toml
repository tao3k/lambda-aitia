[package]
name = "aitia-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "AITIA owner-scoped Scheme program execution"

[features]
gitops = ["dep:aitia-jj"]
sysml = ["dep:opensysml", "gitops"]
linked-program = ["dep:gerbil-scheme", "gerbil-scheme/external-program", "dep:gerbil-scheme-aot-build", "dep:gerbil-scheme-sys", "gitops", "dep:serde", "dep:serde_json", "dep:ring", "dep:ureq"]

[dependencies]
ring = { version = "=0.17.14", optional = true }
opensysml = { version = "=0.12.1", optional = true }
aitia-jj = { path = "../aitia-jj", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "=3.2.1", default-features = false, features = ["rustls"], optional = true }
gerbil-scheme = { workspace = true, optional = true }
gerbil-scheme-sys = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "dfe8b62b5dc64de88f8d70a77059a1741218ef80", optional = true }

[target.'cfg(unix)'.dependencies]
quick-xml = "0.39.4"
sha2 = "0.10.9"
rustix = { version = "1", features = ["event", "fs", "process"] }
tempfile = "3"

[build-dependencies]
gerbil-scheme-aot-build = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "dfe8b62b5dc64de88f8d70a77059a1741218ef80", optional = true }
sha2 = "0.10.9"

[dev-dependencies]
aitia-build-support.workspace = true
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "aitia"
path = "src/bin/aitia.rs"
required-features = ["linked-program"]

[[test]]
name = "policy"
path = "tests/unit/policy.rs"

[[test]]
name = "linked_program"
path = "tests/integration/linked_program.rs"
required-features = ["linked-program"]


[[test]]
name = "agent_input"
path = "tests/integration/agent_input.rs"
required-features = ["linked-program"]

[[test]]
name = "sysml_model"
path = "tests/integration/sysml_model.rs"
required-features = ["sysml"]
