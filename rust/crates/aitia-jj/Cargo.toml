[package]
name = "aitia-jj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only observations of JJ-backed AITIA workspaces"

[features]
real-jj = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aitia-build-support.workspace = true
tempfile = "3"

[[test]]
name = "policy"
path = "tests/unit/policy.rs"

[[test]]
name = "workspace_cut"
path = "tests/integration/workspace_cut.rs"
required-features = ["real-jj"]

[lints]
workspace = true
